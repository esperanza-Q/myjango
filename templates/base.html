<!DOCTYPE html>
{% load static %}
<html lang="en">
<link rel="stylesheet" href="{% static 'css/base.css' %}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Page</title>
    
    <style>

        @font-face {
            font-family: 'HakgyoansimNadeuriTTF-L';
            src: url("../../static/font/Hakgyoansim_Nadeuri_TTF_L.ttf") format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        

        *{
            font-family:"HakgyoansimNadeuriTTF-L";
        }


        

        

        /*--body--*/
        body {
            width: 1440px;
            height: 2265px;
            background-color: #F4D793;
            
            text-align: center;

        
        }

        .mainBody{
            
            width: 1290px;
            height: 2132px;
            background-color: white;
            border-radius:35px;
            
            position: absolute;
            top: 40%;
            left: 50%;
            margin-top: -250px;
            margin-left: -645px;
        }
        
        /*--HEADER START--*/

        .topHeader {
            margin-top:15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            
        }
        
        .searchBar{
            
            width:730px;
            height:80px;
            
            border: 10px solid #7a3b2e;
            border-radius: 100px;
        }

        .searchBar img{
            margin-bottom:-5px;
        }
        
        .searchInput{
            margin-top:15px;
            border: 1px #7C3434;
            border-radius:100px;
            width:600px;
            outline:none;
            height:50px;
            font-size:40px;
            text-align:center;

        }
        

        nav {
            background-color: #FFF;
            padding: 10px;
        }
        .headerLogin{
            margin-right:50px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }
        .loginSignup{
            width: 163px;
            height: 50px;
            background-color: #7C3434;
            color: #FFF6DA;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 20px;
            font-weight:bold;
            font-size:30px;
            transition: all .5s ease;
        }

        .loginSignup:hover{
            color:white;
            background-color: #F4D793;
        }

        hr{
            border: 3px solid #976146;
        }

        .nav {
            background-color: white;
            color:#7C3434;
            border: none;
            padding: 5px 20px;
            margin: 0px 30px 0px 40px;
            cursor: pointer;
            border-radius: 50px;
            font-weight:bold;
            font-size:55px;
            width:220px;
            

            transition: all .5s ease;
            
        }
        
        .nav:hover{
            background-color: #F4D793;
            color:white;
        }

        /*--HEADER END--*/



    </style>

</head>
<body>
    <div class="mainBody">
        <header>
                <div class="topHeader">
                    <a href="{% url 'home' %}">
                        <img src="../../static/img/logo.svg">
                    </a>

                <div class="searchBar">
                    <a href="{% url 'search' %}">
                        <img src="../../static/img/search.svg">
                    </a>
                    <input class="searchInput" type="text" placeholder="누르면 검색 창으로 넘어갑니다.">
                </div>

                <div class="headerLogin">
                    <a href="{% url 'login' %}">
                        <button class="loginSignup">로그인</button>
                    </a>
                    <a href="{% url 'signup' %}">
                        <button class="loginSignup">회원가입</button>
                    </a>
                </div>
            </div>

            <hr>
            <nav>
                <a href="{% url 'create' %}">
                    <button class="nav">CREATE</button>
                </a>
                <a href="{% url 'speedy' %}">
                    <button class="nav">SPEEDY</button>
                </a>
                <a href="{% url 'ask' %}">
                    <button class="nav">ASK</button>
                </a>
                <a href="{% url 'mypage' %}">
                    <button class="nav">MY</button>
                </a>
            </nav>
            <hr>

        </header>
        <main>
            
            
        </main>
    </div>
</body>
</html>
