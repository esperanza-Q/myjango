<!DOCTYPE html>
{% load static %}
<html lang="en">
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Page</title>
    <link rel="stylesheet" href="styles.css">

    <style>

        @font-face {
            font-family: 'HakgyoansimNadeuriTTF-L';
            src: url("../../static/font/Hakgyoansim_Nadeuri_TTF_L.ttf") format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        

        *{
            font-family:"HakgyoansimNadeuriTTF-L";
        }


        
        

        /*--body--*/
        body {
            width: 1440px;
            height: 2265px;
            background-color: #F4D793;
            
            text-align: center;

        
        }

        .mainBody{
            
            width: 1290px;
            height: 2132px;
            background-color: white;
            border-radius:35px;
            
            position: absolute;
            top: 40%;
            left: 50%;
            margin-top: -250px;
            margin-left: -645px;
        }
        
        /*--HEADER START--*/

        .topHeader {
            margin-top:15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            
        }
        
        .searchBar{
            
            width:730px;
            height:80px;
            
            border: 10px solid #7a3b2e;
            border-radius: 100px;
        }
        .searchBar img{
            margin-bottom:-5px;
        }
        
        .searchInput{
            margin-top:15px;
            border: 1px #7C3434;
            border-radius:100px;
            width:600px;
            outline:none;
            height:50px;
            font-size:40px;
            text-align:center;

        }
        

        nav {
            background-color: #FFF;
            padding: 10px;
        }
        .headerLogin{
            margin-right:50px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }
        .profilePic{
            width: 110px;
            height: 110px;
            border: 4px solid #7C3434;
            border-radius: 40%;
        }      
        .username{
            color:#7C3434;
            font-size: 35px;
        }
        .loginSignup{
            width: 163px;
            height: 50px;
            background-color: #7C3434;
            color: #FFF6DA;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 20px;
            font-weight:bold;
            font-size:30px;
            transition: all .5s ease;
        }

        .loginSignup:hover{
            color:white;
            background-color: #F4D793;
        }

        hr{
            border: 3px solid #976146;
        }

        .nav {
            background-color: white;
            color:#7C3434;
            border: none;
            padding: 5px 20px;
            margin: 0px 30px 0px 40px;
            cursor: pointer;
            border-radius: 50px;
            font-weight:bold;
            font-size:55px;
            width:220px;
            

            transition: all .5s ease;
            
        }
        
        .nav:hover{
            background-color: #F4D793;
            color:white;
        }

        /*--HEADER END--*/


        .accBox{
            margin-top: 50px;
            margin-left: 265px;
            width:760px;
        }
        .accBox h2{
            color:#7C3434;
            font-size:50px;
            text-decoration: underline;
        }
        
        .accInputBox{
            width:760px;
            height:481px;
            background-color: #FCEED2;
            border-radius:30px;
        }

        .accInput{
            padding:60px 0px 0px 0px;
        }

        .accInputText{
            margin:30px;
            width: 515px;
            height:65px;
            border:5px solid #7C3434;
            border-radius: 40px;
            font-size:23px;
            text-align: center;
        }
        
        .accButton{
            width: 230px;
            height: 75px;
            background-color: #7C3434;
            color: #FFF6DA;
            border: none;
            padding: 10px 20px;
            margin: 30px 0px 0px 0px;
            cursor: pointer;
            border-radius: 40px;
            font-size:23px;
            transition: all .5s ease;
        }
        .accButton:hover{
            background-color: #F4D793;
            color:#7C3434;
        }

    </style>

</head>

<body>
    <div class="mainBody">
        <header>
                <div class="topHeader">
                    <a href="{% url 'home:home' %}">
                        <img src="../../static/img/logo.svg">
                    </a>

                <div class="searchBar">
                    {% comment %} <a href="{% url 'search' %}"> {% endcomment %}
                        <img src="../../static/img/search.svg">
                    {% comment %} </a> {% endcomment %}
                    <input class="searchInput" type="text" placeholder="누르면 검색 창으로 넘어갑니다.">
                </div>

                <!--로그인 전 버튼 -->
                <div class="headerLogin">
                    <a href="{% url 'home:toLogin' %}">
                        <button class="loginSignup">로그인</button>
                    </a>
                    <a href="{% url 'home:toSignup' %}">
                        <button class="loginSignup">회원가입</button>
                    </a>
                </div>

                <!--로그인 후 프로필-->
                <div class="headerLogin">
                    <img class = "profilePic" src ="../static/img/profilepic.png">
                    <div class = "username">ㅇㅇㅇ 님</div>
                </div>
            </div>

            <hr>
            <nav>
                {% comment %} <a href="{% url 'create' %}"> {% endcomment %}
                    <button class="nav">CREATE</button>
                {% comment %} </a>
                <a href="{% url 'speedy' %}"> {% endcomment %}
                    <button class="nav">SPEEDY</button>
                {% comment %} </a>
                <a href="{% url 'ask' %}"> {% endcomment %}
                    <button class="nav">ASK</button>
                {% comment %} </a>
                <a href="{% url 'mypage' %}"> {% endcomment %}
                    <button class="nav">MY</button>
                {% comment %} </a> {% endcomment %}
            </nav>
            <hr>

        </header>
        <main>
            <div class="accBox">
                <h2>로그인</h2>
                <div class="accInputBox">
                    <form action="{% url 'accounts:login' %}" method="POST">
                        {% csrf_token %}
                        <div class="accInput">
                        <input name="username" class="accInputText" type="text" placeholder="아이디">
                        <br>
                        <input name="password" class="accInputText" type="password" placeholder="비밀번호">
                        </div>
                        <button class="accButton" type="submit">로그인</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
