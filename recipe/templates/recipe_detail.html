<!DOCTYPE html>
{% load static %}
<html lang="en">
<link rel="stylesheet" href="{% static 'css/recipe_detail.css' %}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Page</title>
    
    <style>

        @font-face {
            font-family: 'HakgyoansimNadeuriTTF-L';
            src: url("../../static/font/Hakgyoansim_Nadeuri_TTF_L.ttf") format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        

        *{
            font-family:"HakgyoansimNadeuriTTF-L";
        }

        /*--body--*/
        body {
            width: 1440px;
            height: 2265px;
            background-color: #F4D793;
            
            text-align: center;

        
        }

        .mainBody{
            
            width: 1290px;
            height: 2132px;
            background-color: white;
            border-radius:35px;
            
            position: absolute;
            top: 40%;
            left: 50%;
            margin-top: -250px;
            margin-left: -645px;
        }
        
        /*--HEADER START--*/

        .topHeader {
            margin-top:15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            
        }
        
        .searchBar{
            
            width:730px;
            height:80px;
            
            border: 10px solid #7a3b2e;
            border-radius: 100px;
        }

        .searchBar img{
            margin-bottom:-5px;
        }
        
        .searchInput{
            margin-top:15px;
            border: 1px #7C3434;
            border-radius:100px;
            width:600px;
            outline:none;
            height:50px;
            font-size:40px;
            text-align:center;

        }
        

        nav {
            background-color: #FFF;
            padding: 10px;
        }
        .headerLogin{
            margin-right:50px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }
        .loginSignup{
            width: 163px;
            height: 50px;
            background-color: #7C3434;
            color: #FFF6DA;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 20px;
            font-weight:bold;
            font-size:30px;
            transition: all .5s ease;
        }

        .loginSignup:hover{
            color:white;
            background-color: #F4D793;
        }

        hr{
            border: 3px solid #976146;
        }

        .nav {
            background-color: white;
            color:#7C3434;
            border: none;
            padding: 5px 20px;
            margin: 0px 30px 0px 40px;
            cursor: pointer;
            border-radius: 50px;
            font-weight:bold;
            font-size:55px;
            width:220px;
            

            transition: all .5s ease;
            
        }
        
        .nav:hover{
            background-color: #F4D793;
            color:white;
        }

        /*--HEADER END--*/


        .recipeCardDiv{
            
            margin: 50px 120px 20px 120px;
            width:1050px;
            height:650px;
            display:flex;
        }

        .recipePic{
            
            width:530px;
            height:610px;
            background-color: #FCEED2;
            border:1px solid #B29170;
            border-radius:30px;

        }

        .recipePic img{
            width:460px;
            height:420px;
            margin:35px 0px 10px 0px;
        }

        .recipeTitleBox{
            width:530px;
            height:70px;
            position:relative;
            
        }
        
        .recipeTitle{
            margin-right:35px;
            float:right;
            text-shadow: -1px 0 #7C3434, 0 1px #7C3434, 1px 0 #7C3434, 0 -1px #7C3434;
            color:#FFF;
            font-size:60px;
        }

        .recipeDescription{
            font-size:30px;
            margin-right:35px;
            float:right;
            color:#7C3434;
        }

        .recipeLikeDiv{
            display:flex;
        }
        
        .likeEmoji {
            margin: 0px 20px 20px 50px;
            width:195px;
            height:80px;
            margin-bottom:-10px;
            position: relative;
            background: #D7E0BC;
            border-radius: .4em;
            font-size:60px;
        }

        .likeEmoji:after {
            
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 0;
            height: 0;
            border: 40px solid transparent;
            border-top-color: #D7E0BC;
            border-bottom: 0;
            border-left: 0;
            margin-left: -10px;
            margin-bottom: -10px;
        }

        .likeNum{
            width:240px;
            height:76px;
            background-color: #FCEED2;
            border:1px solid #B29170;
            border-radius: 25px;
            font-size: 28px;
        }
        
        .likeNum div{
            margin-top:20px;
            color:#7C3434;
        }

        .tape{
            position:absolute;
            transform: rotate(40deg);
            width:155px;
            height:50px;
            top:520px;
            right:100px;
            background-color:#96A177;
            border: 1px solid #7C3434;
            
        }


        .recipeIngredientCard{

            margin: 60px 20px 20px 50px;

            width:450px;
            height:495px;
            background-color: #B29170;
            border: 1px solid #7C3434;
            align-items: center;
        }

        .recipeIngredients{
            width:385px;
            height:425px;
            background-color: #fff;
            border:1px solid #7C3434;
            margin:30px;
        }

        .recipeIngredients h3{
            font-size:40px;
            color:#7C3434;
            line-height: 27px;
        }

        .recipeIngredients ul{
            width:250px;
            height:280px;
            margin: 0px 47px 0px 47px;
            overflow:hidden; 
            overflow-y:scroll;
            
            
        }

        .recipeIngredients ul::-webkit-scrollbar{
            width: 10px;
        }

        .recipeIngredients ul::-webkit-scrollbar-track {
            background-color: #fff;
        }

        .recipeIngredients ul::-webkit-scrollbar-thumb { 
            background-color: #96A177;
        }


        .recipeIngredients li{
            font-size:25px;
            color:#7C3434;
            line-height: 40px;
            text-align: left;
        }

        .recipeInfoDiv{
            display:flex;
            color:#7C3434;
            margin-left:300px;
        }
        
        

        .recipeTime{
            display:flex;
            width: 510px;
            height:140px;
            background-color: #D7E0BC;
            margin:0px 20px 0px 0px;
            border:1px solid #B29170;
            border-radius: 20px;
        }

        .recipeTime h5{
            font-size: 23px;

        }

        .timeDiv{
            font-weight: bold;
            width:190px;
            font-size: 45px;
            line-height: 10px;
        }

        .servingsDiv{
            margin-left:60px;
            width:260px;
            font-size: 40px;
            margin-top:35px;
            text-align: center;
            display:flex;
        }

        .servingsDiv p{
            margin:10px 0px 0px 15px;
        }

        .recipeScrap{
            margin-top:-1px;
            width:160px;
            height:144px;
            border:1px solid #B29170;
            background-color:#fff;
            border-radius: 20px;
            font-size: 25px;
            color:#7C3434;
            cursor: pointer;
            
        }

        .recipeScrap:hover{
            background-color: #FCEED2;
        }
        
        .recipeScrap img{
            width:83px;
            height:84px;
        }



        .servingsDiv input{
            font-size:30px;
            width:150px;
            height:60px;
            border:none;
            border-radius:10px;
            outline:none;
            color:#7C3434;
            text-align: center;
        }

        .servingsDiv input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            opacity: 1;
            height:40px;
            color: #FFF;
        }



        .divider {
            border-left: 1px solid #B29170;
            margin-top:20px;
            width: 0px;
            height: 100px;
            
            right: 250px;
            top: 10px;
        }

        .pageDivider{
            border-top: 1px solid #B29170;
            margin: 80px 40px 80px 40px;
            width: 1200px;
            height: 0px;
            
        }
        
        .recipeSteps{
            text-align: left;
            color:#7C3434;
            font-size: 32px;
        }

        .stepNum{
            margin: 30px 0px 10px 120px;
            
            text-shadow: -1px 0 #7C3434, 0 1px #7C3434, 1px 0 #7C3434, 0 -1px #7C3434;
            color:#F4D793;
            font-size:60px;
            font-weight:bold;

        }
        .stepInstructions{
            margin:20px 20px 10px 180px;
            width: 980px;
            height:fit-content;
        }

    </style>

</head>
<body>
    <div class="mainBody">
        <header>
                <div class="topHeader">
                    <a href="{% url 'home' %}">
                        <img src="../../static/img/logo.svg">
                    </a>

                <div class="searchBar">
                    <a href="{% url 'search' %}">
                        <img src="../../static/img/search.svg">
                    </a>
                    <input class="searchInput" type="text" placeholder="누르면 검색 창으로 넘어갑니다.">
                </div>

                <div class="headerLogin">
                    <a href="{% url 'login' %}">
                        <button class="loginSignup">로그인</button>
                    </a>
                    <a href="{% url 'signup' %}">
                        <button class="loginSignup">회원가입</button>
                    </a>
                </div>
            </div>

            <hr>
            <nav>
                <a href="{% url 'create' %}">
                    <button class="nav">CREATE</button>
                </a>
                <a href="{% url 'speedy' %}">
                    <button class="nav">SPEEDY</button>
                </a>
                <a href="{% url 'ask' %}">
                    <button class="nav">ASK</button>
                </a>
                <a href="{% url 'mypage' %}">
                    <button class="nav">MY</button>
                </a>
            </nav>
            <hr>

        </header>
        <main>
            
            <div class="recipeCardDiv">
                <div class="recipePic">
                    <img src="../../static/img/temp.jpg">
                    <div class="recipeTitleBox">
                        <div class="recipeTitle">돌솥비빔밥</div>
                    </div>
                    <div class="recipeTitleBox">
                        <div class="recipeDescription">(간단한 레시피 설명)</div>
                    </div>
                    
                    
                </div>

                <div class ="recipeHorizontalDiv">
                    <div class="recipeLikeDiv">
                        <div class="likeEmoji"> &#128512;</div>
                        <div class="likeNum"> <div>000 명이 좋아해요!</div></div>
                    </div>
                    <div class="tape"></div>
                    <div class="recipeIngredientCard">
                        <div class="recipeIngredients">
                            <h3>재료</h3>
                            <ul>
                                <li>계란 2개</li>
                                <li>당근 반개</li>
                                <li>계란 2개</li>
                                <li>당근 반개</li>
                                <li>계란 2개</li>
                                <li>당근 반개</li>
                                <li>계란 2개</li>
                                <li>당근 반개</li>
                                <li>계란 2개</li>
                                <li>당근 반개</li>
                                <li>계란 2개</li>
                                <li>당근 2개</li>
                            </ul>
                        </div>
                    </div>
                </div>

            </div>

            <div class="recipeInfoDiv">
                <div class="recipeTime">
                    <div class="timeDiv">
                        <h5>소요시간</h5>
                        <div class="time">
                            10:00
                        </div>
                        

                    </div>
                    <div class="divider"></div>
                    <div class="servingsDiv">
                        <input type="number">
                        <p>인분</p>
                    </div>

                </div>
                <button class="recipeScrap">
                    <div class="recipeScrapDiv">
                        <img src="../../static/img/scrap.svg">
                    </div>
                    스크랩
                </button>
            </div>

            <div class="pageDivider"> </div>

            <div class="recipeSteps">
                <div class="stepNum">step 1</div>
                <br>
                <div class="stepInstructions">자세한 레시피 설명 1</div>
                <br>
                <div class="stepNum">step 2</div>
                <br>
                <div class="stepInstructions">자세한 레시피 설명 1</div>

            </div>
            
        </main>
    </div>
</body>
</html>
